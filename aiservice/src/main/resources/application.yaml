spring:
  application:
    name: aiservice


  mongodb:
    uri: mongodb://localhost:27017/airecommendationfitness
    database: airecommendationfitness


  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: activity-processor-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.use.type.headers: false
        spring.json.value.default.type: org.fitness.aiservice.model.Activity
        spring.json.trusted.packages: "*"

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
server:
  port: 8083


kafka:
  topic:
    name: activity-events


gemini:
  api:
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
    key: AQ.Ab8RN6KBtEYxjl_5ZeSzuiZ8q9xD2b_STjLnKRc1qS5IB4XG4Q